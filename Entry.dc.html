<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="styles.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: var(--color-bg); color: var(--color-text); }
  a { color: var(--color-accent); text-decoration: none; }
  a:hover { color: var(--color-accent-300); }
  .eg-prose { font-size: 16px; line-height: 1.75; color: color-mix(in srgb, #e9e9ed 80%, transparent); }
  .eg-prose h2 { font-size: 15px; font-family: 'JetBrains Mono', monospace; font-weight: 500; letter-spacing: .04em; color: #e9e9ed; margin: 52px 0 14px; padding-left: 16px; border-left: 2px solid var(--color-accent); line-height: 1.4; }
  .eg-prose h3 { font-size: 18px; margin: 32px 0 10px; color: #e9e9ed; }
  .eg-prose p { margin: 0 0 18px; }
  .eg-prose strong { color: #e9e9ed; font-weight: 600; }
  .eg-prose ul, .eg-prose ol { margin: 0 0 20px; padding-left: 22px; }
  .eg-prose li { margin-bottom: 8px; }
  .eg-prose li::marker { color: var(--color-accent); font-family: 'JetBrains Mono', monospace; font-size: 13px; }
  .eg-prose code { font-family: 'JetBrains Mono', monospace; font-size: .88em; background: color-mix(in srgb, #e9e9ed 8%, transparent); padding: 1px 5px; border-radius: 4px; }
  .eg-prose a { text-decoration: underline; text-underline-offset: 3px; }
  @keyframes eg-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  @media (max-width: 860px) {
    [data-m~="entry-card"] { grid-template-columns: 1fr !important; }
    [data-m~="entry-media"] { min-height: 200px !important; }
    [data-m~="entry-overlay"] { background: linear-gradient(to bottom, transparent 30%, rgba(22,24,38,.9) 100%) !important; }
    [data-m~="entry-body"] { padding: 22px 22px 26px !important; }
    [data-m~="contact-grid"] { grid-template-columns: 1fr !important; gap: 26px !important; }
  }
  @media (max-width: 700px) {
    [data-m~="gutter"] { padding-left: 20px !important; padding-right: 20px !important; }
    [data-m~="nav-links"] { gap: 15px !important; font-size: 12px !important; }
    [data-m~="hero"] { padding-top: 56px !important; padding-bottom: 48px !important; gap: 30px !important; flex-direction: column-reverse !important; align-items: flex-start !important; }
    [data-m~="hero-photo"] { width: 172px !important; height: 215px !important; }
    [data-m="h1"] { font-size: 40px !important; }
    [data-m="page-h1"] { font-size: 34px !important; }
    [data-m="entry-h1"] { font-size: 30px !important; }
    [data-m~="card"] { grid-template-columns: 1fr !important; gap: 14px !important; }
    [data-m~="card-img"] { height: 168px !important; }
    [data-m~="card-body"] { padding: 0 2px 4px !important; }
    [data-m~="hero-meta"] { flex-wrap: wrap; }
    [data-m~="section-pad"] { padding-top: 60px !important; padding-bottom: 80px !important; }
    [data-m~="entry-figure"] img { max-height: 260px !important; }
  }
</style>
</helmet>
<div style="position:relative;min-height:100vh;background:var(--color-bg);overflow-x:hidden">
  <div style="position:fixed;top:0;left:0;height:2px;background:var(--color-accent);z-index:60;box-shadow:0 0 12px rgba(145,132,217,.9);width:{{ progress }}"></div>
  <div style="position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(to right,rgba(233,233,237,.045) 1px,transparent 1px),linear-gradient(to bottom,rgba(233,233,237,.045) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(110% 45% at 30% 0%,#000 0%,transparent 70%);-webkit-mask-image:radial-gradient(110% 45% at 30% 0%,#000 0%,transparent 70%)"></div>

  <nav style="position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:color-mix(in srgb,#161826 76%,transparent);border-bottom:1px solid color-mix(in srgb,#e9e9ed 8%,transparent)">
    <div data-m="gutter" style="max-width:1000px;margin:0 auto;padding:15px 32px;display:flex;align-items:center;justify-content:space-between;gap:24px">
      <a href="Home.dc.html" style="font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:500;color:var(--color-text);letter-spacing:.08em;display:flex;align-items:center;gap:5px">
        <span style="color:var(--color-accent)">[</span>EG<span style="color:var(--color-accent)">]</span>
      </a>
      <div data-m="nav-links" style="display:flex;align-items:center;gap:26px;font-family:'JetBrains Mono',monospace;font-size:13px">
        <a href="Home.dc.html" style="color:color-mix(in srgb,#e9e9ed 62%,transparent)" style-hover="color:var(--color-text)">home</a>
        <a href="Research.dc.html" style="color:color-mix(in srgb,#e9e9ed 62%,transparent)" style-hover="color:var(--color-text)">research</a>
        <a href="Projects.dc.html" style="color:color-mix(in srgb,#e9e9ed 62%,transparent)" style-hover="color:var(--color-text)">projects</a>
        <a href="Contact.dc.html" style="color:color-mix(in srgb,#e9e9ed 62%,transparent)" style-hover="color:var(--color-text)">contact</a>
      </div>
    </div>
  </nav>

  <main data-m="gutter section-pad" style="position:relative;max-width:1000px;margin:0 auto;padding:52px 32px 120px">
    <a href="{{ backHref }}" style="font-family:'JetBrains Mono',monospace;font-size:12.5px;display:inline-block;margin-bottom:36px">← back to {{ backLabel }}</a>

    <header style="max-width:74ch;margin-bottom:44px">
      <div style="font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--color-accent);margin-bottom:16px">{{ date }}</div>
      <h1 data-m="entry-h1" style="font-size:42px;line-height:1.1;letter-spacing:-.03em;margin:0 0 18px;font-weight:500">{{ title }}</h1>
      <p style="font-size:17px;line-height:1.65;color:color-mix(in srgb,#e9e9ed 66%,transparent);margin:0 0 22px">{{ summary }}</p>
      <div style="display:flex;flex-wrap:wrap;gap:7px;align-items:center">
        <sc-for list="{{ tagList }}" as="tg" hint-placeholder-count="3">
          <span style="font-family:'JetBrains Mono',monospace;font-size:10.5px;padding:3px 9px;border-radius:4px;white-space:nowrap;border:1px solid color-mix(in srgb,#9184d9 32%,transparent);color:var(--color-accent-300)">{{ tg }}</span>
        </sc-for>
      </div>
    </header>

    <figure data-m="entry-figure" style="position:relative;border-radius:14px;overflow:hidden;border:1px solid color-mix(in srgb,#e9e9ed 10%,transparent);background:#0f1119;margin-bottom:56px">
      <sc-if value="{{ image }}" hint-placeholder-val="{{ false }}">
        <img src="{{ image }}" alt="{{ title }}" style="width:100%;max-height:460px;object-fit:cover;display:block">
      </sc-if>
    </figure>

    <article class="eg-prose" style="max-width:74ch">{{ bodyHtml }}</article>

    <sc-if value="{{ link }}" hint-placeholder-val="{{ true }}">
      <div style="margin-top:56px">
        <a class="btn btn-primary" href="{{ link }}" target="_blank" rel="noreferrer noopener" style="font-family:'JetBrains Mono',monospace;font-size:13px;padding:9px 17px;white-space:nowrap">View the repository →</a>
      </div>
    </sc-if>

    <div style="margin-top:72px;padding-top:28px;border-top:1px solid color-mix(in srgb,#e9e9ed 10%,transparent);display:flex;gap:14px;flex-wrap:wrap">
      <a class="btn btn-secondary" href="{{ backHref }}" style="font-family:'JetBrains Mono',monospace;font-size:13px;padding:9px 17px;white-space:nowrap">← All {{ backLabel }}</a>
      <a class="btn btn-secondary" href="Contact.dc.html" style="font-family:'JetBrains Mono',monospace;font-size:13px;padding:9px 17px;white-space:nowrap">Get in touch</a>
    </div>
  </main>

  <footer style="position:relative;border-top:1px solid color-mix(in srgb,#e9e9ed 8%,transparent)">
    <div data-m="gutter" style="max-width:1000px;margin:0 auto;padding:26px 32px;display:flex;align-items:center;justify-content:flex-end;gap:20px;flex-wrap:wrap">
      <div style="display:flex;gap:20px;font-family:'JetBrains Mono',monospace;font-size:12.5px">
        <a href="https://www.linkedin.com/in/eitan-gonensky-003340350/" target="_blank" rel="noreferrer noopener">LinkedIn</a>
        <a href="https://github.com/EiGeGo" target="_blank" rel="noreferrer noopener">GitHub</a>
        <a href="Contact.dc.html">Contact</a>
      </div>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { entry: null, html: '', toc: [], progress: 0, error: '' };

  async componentDidMount() {
    const q = new URLSearchParams(location.search);
    const kind = q.get('kind') === 'projects' ? 'projects' : 'posts';
    const slug = q.get('slug') || (kind === 'projects' ? 'openai-build-week' : 'summer-reu');
    const site = await import('./site.js');
    try {
      const entry = await site.loadEntry(kind, slug);
      let html = site.markdownToHtml(entry.body);
      const toc = [];
      html = html.replace(/<h2>(.*?)<\/h2>/g, (m, t) => {
        const id = 'sec-' + toc.length;
        toc.push({ text: t.replace(/<[^>]+>/g, ''), href: '#' + id });
        return `<h2 id="${id}">${t}</h2>`;
      });
      this.setState({ entry, html, toc });
    } catch (e) {
      this.setState({ error: e.message });
    }
    this._onScroll = () => {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      this.setState({ progress: max > 0 ? Math.min(1, window.scrollY / max) : 0 });
    };
    window.addEventListener('scroll', this._onScroll, { passive: true });
  }

  componentWillUnmount() { window.removeEventListener('scroll', this._onScroll); }

  renderVals() {
    const e = this.state.entry || {};
    const kind = e.kind === 'projects' ? 'projects' : 'posts';
    return {
      title: this.state.error ? 'Content not found' : (e.title || ''),
      summary: this.state.error || e.summary || '',
      date: e.date || (e.publishedAt ? new Date(e.publishedAt + 'T00:00:00').toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }) : ''),
      image: e.image || '',
      tagList: e.tagList || [],
      link: e.link || '',
      toc: this.state.toc,
      progress: (this.state.progress * 100).toFixed(1) + '%',
      backHref: kind === 'projects' ? 'Projects.dc.html' : 'Research.dc.html',
      backLabel: kind === 'projects' ? 'projects' : 'research',
      bodyHtml: React.createElement('div', { dangerouslySetInnerHTML: { __html: this.state.html } })
    };
  }
}
</script>
</body>
</html>
